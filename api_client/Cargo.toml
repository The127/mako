[package]
name = "mako_client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust client library for the Mako zero-trust KV store"
repository = "https://github.com/The127/mako"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
shared = { path = "../shared"}
anyhow = "1.0.102"
thiserror = "2.0.18"
log = "0.4.29"
